<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة الشروحات وبنك الأسئلة المباشرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body{ background:#eef3f9; padding:20px; }
.container{ max-width:1100px; margin:auto; }

.page-tabs {
    display: flex; gap: 10px; margin-bottom: 15px; align-items: center; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap;
}
.tab-btn {
    background: #e2e8f0; color: #0d2344; padding: 10px 18px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: #0d2344; color: #fff; }
.add-tab-btn { background: #f3b31a; color: #0d2344; font-weight: 800; }
.del-tab-btn { background: #721c24; color: #fff; padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; }

.preview{
background: #ffffff;
position:relative;
padding:30px;
overflow:hidden;
width: 1000px;
min-height: 1414px; /* مقاس A4 الطولي المثالي */
display: flex;
flex-direction: column;
justify-content: space-between;
box-shadow: 0 10px 30px rgba(0,0,0,0.08);
border-radius: 12px;
margin: 0 auto;
}

.top-header { display: flex; align-items: center; justify-content: space-between; position: relative; margin-bottom: 15px; flex-shrink: 0; }
.logo-circle { width: 130px; height: 130px; background: #FFC926; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 5; overflow: hidden; padding: 0; border: 3px solid #0d2344; }
.logo-circle img { width: 100%; height: 100%; object-fit: cover; }
.main-title-box { background: #0d2344; color: white; flex: 1; margin-right: -30px; margin-left: 20px; height: 65px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 28px; font-weight: 800; padding-right: 40px; }

.badge-row { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; width: 100%; flex-shrink: 0; }
.line-separator { flex: 1; height: 2px; background: #0d2344; position: relative; margin: 0 20px; }
.line-separator::after { content: ''; position: absolute; width: 8px; height: 8px; background: #0d2344; border-radius: 50%; top: -3px; }
.line-separator.right::after { left: 0; } .line-separator.left::after { right: 0; }
.badge-main { background: #f3b31a; color: #0d2344; font-size: 24px; font-weight: 800; padding: 4px 35px; border-radius: 12px; white-space: nowrap; border: 2px solid #0d2344; }

.content-card { border: 3px solid #0d2344; border-radius: 20px; background: #ffffff; padding: 25px; flex: 1; display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }

/* تصميم بنك الأسئلة والمراجعة المباشرة الجديد */
.qa-container { display: flex; flex-direction: column; gap: 15px; width: 100%; }
.qa-item-box { border: 2px solid #0d2344; border-radius: 15px; padding: 15px; background: #f8fafc; }
.qa-question { font-size: 20px; font-weight: 800; color: #0d2344; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
.qa-qnum { background: #0d2344; color: #fff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.qa-options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qa-opt { background: #fff; border: 1.5px solid #cbd5e1; padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: 700; color: #334155; }
/* الإجابة الصحيحة بتبقي مميزة وواضحة جداً */
.qa-opt.correct { background: #dcfce7; border-color: #16a34a; color: #166534; font-weight: 800; }

.cards-grid { display: grid; gap: 15px; width: 100%; }
.info-card-item { border: 2px solid #0d2344; border-radius: 15px; padding: 15px; background: #f8fafc; }
.info-card-title { font-size: 21px; font-weight: 800; color: #0d2344; margin-bottom: 5px; }
.info-card-desc { font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }

.comparison-table { width: 100%; border-collapse: collapse; }
.comparison-table th, .comparison-table td { border: 2px solid #0d2344; padding: 10px; text-align: center; font-size: 18px; font-weight: 700; }
.comparison-table th { background: #0d2344; color: white; }
.comparison-table td { color: #0d2344; background: #fff; }

.steps-container { display: flex; flex-direction: column; gap: 12px; }
.step-row { display: flex; align-items: center; gap: 15px; background: #f8fafc; border: 2px solid #0d2344; border-radius: 12px; padding: 12px 18px; }
.step-num { width: 40px; height: 40px; background: #0d2344; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex-shrink: 0; }
.step-text { font-size: 20px; font-weight: 700; color: #0d2344; }

.custom-paragraph-box { background: #f8fafc; border-right: 6px solid #0d2344; padding: 15px 20px; border-radius: 10px; width: 100%; border: 2px solid #0d2344; }
.para-title { font-size: 22px; font-weight: 800; color: #0d2344; margin-bottom: 5px; }
.para-text { font-size: 19px; font-weight: 600; color: #333; line-height: 1.6; }

.alert-box { background: #fffdf0; border: 2px dashed #f3b31a; border-radius: 15px; padding: 15px 20px; width: 100%; display: flex; align-items: center; gap: 15px; }
.alert-icon { font-size: 32px; }
.alert-content { flex: 1; }
.alert-title { font-size: 20px; font-weight: 800; color: #0d2344; margin-bottom: 3px; }
.alert-text { font-size: 18px; font-weight: 600; color: #444; }

.forms-grid { display: grid; gap: 15px; width: 100%; }
.super-form-card { border: 2px solid #0d2344; border-radius: 15px; background: #ffffff; overflow: hidden; }
.super-form-header { background: #0d2344; color: #fff; padding: 10px 15px; font-size: 20px; font-weight: 800; }
.super-form-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.sf-sub-title { font-size: 18px; font-weight: 800; color: #0d2344; }
.sf-para { font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }
.sf-list { padding-right: 20px; font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }
.sf-note { background: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: 700; color: #0d2344; border-right: 4px solid #f3b31a; }

.f-theme-blue .super-form-header { background: #0d2344 !important; }
.f-theme-green .super-form-header { background: #155724 !important; }
.f-theme-red .super-form-header { background: #721c24 !important; }
.f-theme-purple .super-form-header { background: #5a2d82 !important; }
.f-theme-orange .super-form-header { background: #c65102 !important; }

.highlight-text { color: #d97706; background: rgba(243, 179, 26, 0.2); padding: 2px 6px; border-radius: 4px; font-weight: 700; }

.footer-bar { background: #0d2344; height: 60px; margin: 0 -30px -30px -30px; position: relative; display: flex; justify-content: center; align-items: center; border-top: 5px solid #f3b31a; flex-shrink: 0; }
.footer-text { color: white; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 40px; }
.footer-text::before, .footer-text::after { content: ''; display: inline-block; width: 40px; height: 3px; background: #f3b31a; }

.theme-green .main-title-box, .theme-green .step-num, .theme-green .footer-bar, .theme-green .comparison-table th { background: #155724 !important; }
.theme-red .main-title-box, .theme-red .step-num, .theme-red .footer-bar, .theme-red .comparison-table th { background: #721c24 !important; }
.theme-purple .main-title-box, .theme-purple .step-num, .theme-purple .footer-bar, .theme-purple .comparison-table th { background: #5a2d82 !important; }
.theme-orange .main-title-box, .theme-orange .step-num, .theme-orange .footer-bar, .theme-orange .comparison-table th { background: #c65102 !important; }

.panel{ margin-top:30px; background:#fff; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,.08); }
.panel h2{ margin-bottom:15px; color:#0d2344; }
label{ display:block; margin-top:12px; margin-bottom:4px; font-weight:700; }
input, textarea, select{ width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; font-size:17px; background: #fff; }
textarea{ height:65px; resize:none; }
.btns{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
button{ flex:1; padding:14px; border:none; border-radius:12px; background:#0d2344; color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
button:hover{ opacity:.9; }
.section-builder-box { background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-top: 15px; position: relative; }
.sec-actions { display: flex; gap: 8px; position: absolute; left: 15px; top: 15px; }
.icon-btn { background: #cbd5e1; color: #0d2344; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
.del-sec-btn { background: #721c24; color: #fff; }
.card-control-box { background: #fff; border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; margin-top: 10px; }
.add-sec-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; background: #e2e8f0; padding: 15px; border-radius: 12px; }
.add-sec-bar button { background: #0d2344; font-size: 15px; padding: 10px; }
</style>
</head>
<body>

<div class="container">
  
  <div class="page-tabs">
    <div id="tabsContainer" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    <button class="tab-btn add-tab-btn" onclick="addNewPage()">➕ إضافة صفحة جديدة</button>
    <button class="tab-btn del-tab-btn" onclick="deleteCurrentPage()">🗑️ حذف هذه الصفحة</button>
  </div>

  <div class="preview" id="capture">
    
    <div class="top-header">
        <div class="main-title-box" id="title">بنك أسئلة واختبارات المنهج</div>
        <div class="logo-circle">
            <img id="logoImg" src="https://upload.wikimedia.org/wikipedia/commons/e/fe/Coat_of_arms_of_Egypt_%20%28Official%29.svg">
        </div>
    </div>
    
    <div class="badge-row">
        <div class="line-separator right"></div>
        <div class="badge-main" id="badge">💡 أسئلة مع الإجابات النموذجية المباشرة</div>
        <div class="line-separator left"></div>
    </div>
    
    <div class="content-card" id="dynamicContentCard"></div>
    
    <div class="footer-bar">
        <div class="footer-text">
            <span id="footerDesigner">م. على عادل</span>
            <span id="footerPageNum" style="display:none; background:#f3b31a; color:#0d2344; padding:2px 12px; border-radius:6px; font-size:18px;"></span>
        </div>
    </div>
    
  </div>

  <div class="panel">
    <h2>لوحة تحكم بنك الأسئلة والمراجعة المباشرة</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button onclick="saveProjectToLocal()" style="background:#155724;">💾 حفظ المشروع محلياً</button>
        <button onclick="loadProjectFromLocal()" style="background:#016280;">📂 فتح المشروع المحفوظ</button>
    </div>

    <label>🎨 اختر لون الثيم البصري العام</label>
    <select id="themeInput" onchange="updateGlobalSettings()">
        <option value="blue">الأزرق الملكي (الافتراضي)</option>
        <option value="green">الأخضر العشبي</option>
        <option value="red">الأحمر العنابي</option>
        <option value="purple">البنفسجي الإبداعي</option>
        <option value="orange">البرتقالي الدافئ</option>
    </select>

    <label>العنوان العلوي الرئيسي</label>
    <input id="titleInput" value="بنك أسئلة واختبارات المنهج" oninput="updateGlobalSettings()">
    
    <label>نص الشارة الوسطى</label>
    <input id="badgeInput" value="💡 أسئلة مع الإجابات النموذجية المباشرة" oninput="updateGlobalSettings()">

    <label>اختر اللوجو من جهازك:</label>
    <input type="file" id="logoUploadInput" accept="image/*">
    
    <label>اسم المصمم (الفوتر)</label>
    <input id="footerInput" value="م. على عادل" oninput="updateGlobalSettings()">

    <div class="section-box" style="margin-top:15px;">
        <label><input type="checkbox" id="chkShowPage" onchange="updateGlobalSettings()" style="width:20px; height:20px; display:inline-block;"> تفعيل ترقيم الصفحات في الفوتر</label>
    </div>

    <h3 style="margin-top:25px; color:#0d2344;">➕ أضف أقساماً للصفحة الحالية:</h3>
    <div class="add-sec-bar">
        <button onclick="addSection('qaBank')">➕ بنك أسئلة وإجابات (جديد)</button>
        <button onclick="addSection('para')">➕ فقرة / عنوان</button>
        <button onclick="addSection('cards')">➕ قسم كروت</button>
        <button onclick="addSection('table')">➕ جدول مقارنة</button>
        <button onclick="addSection('steps')">➕ خطوات مرتبة</button>
        <button onclick="addSection('forms')">➕ سوبر فورم</button>
    </div>

    <div id="sectionsControlsList" style="margin-top:20px;"></div>

    <div class="btns">
        <button onclick="downloadCurrentImage()" style="background: #f3b31a; color: #0d2344;">تحميل الصفحة كـ صورة HD 🖼️</button>
        <button onclick="downloadAllPagesPDF()" style="background: #c65102; color: #fff;">تصدير كل الصفحات PDF 📄</button>
    </div>
  </div>

</div>

<script>
let projectData = {
    global: {
        title: "بنك أسئلة واختبارات المنهج",
        badge: "💡 أسئلة مع الإجابات النموذجية المباشرة",
        footer: "م. على عادل",
        theme: "blue",
        showPage: false,
        logoSrc: "https://upload.wikimedia.org/wikipedia/commons/e/fe/Coat_of_arms_of_Egypt_%20%28Official%29.svg"
    },
    currentPageIndex: 0,
    pages: [
        {
            sections: [
                { 
                    id: 1, 
                    type: "qaBank", 
                    questions: [
                        { q: "ما هي وحدة قياس الشدّة الكهربية في النظام الدولي؟", opt1: "الفولت", opt2: "الأمبير", opt3: "الأوم", opt4: "الواط", correct: "2" },
                        { q: "تتحول الطاقة الكهربية في المصباح الكهربي إلى طاقة:", opt1: "حركية فقط", opt2: "حرارية فقط", opt3: "حرارية وضوئية", opt4: "صوتية", correct: "3" }
                    ] 
                }
            ]
        }
    ]
};

function renderTabs() {
    const container = document.getElementById("tabsContainer");
    container.innerHTML = "";
    projectData.pages.forEach((p, idx) => {
        const activeClass = idx === projectData.currentPageIndex ? "active" : "";
        container.innerHTML += `<button class="tab-btn ${activeClass}" onclick="switchPage(${idx})">صفحة ${idx + 1}</button>`;
    });
}

function addNewPage() {
    projectData.pages.push({ sections: [] });
    projectData.currentPageIndex = projectData.pages.length - 1;
    renderTabs();
    renderSectionsControls();
    renderPreview();
}

function deleteCurrentPage() {
    if(projectData.pages.length === 1) { alert("لا يمكنك حذف الصفحة الأخيرة!"); return; }
    projectData.pages.splice(projectData.currentPageIndex, 1);
    if(projectData.currentPageIndex >= projectData.pages.length) projectData.currentPageIndex = projectData.pages.length - 1;
    renderTabs(); renderSectionsControls(); renderPreview();
}

function switchPage(index) {
    projectData.currentPageIndex = index;
    renderTabs(); renderSectionsControls(); renderPreview();
}

function addSection(type) {
    const curPage = projectData.pages[projectData.currentPageIndex];
    let newSec = { id: Date.now(), type: type };

    if(type === 'qaBank') {
        newSec.questions = [
            { q: "اكتب نص السؤال هنا...", opt1: "الاختيار الأول", opt2: "الاختيار الثاني", opt3: "الاختيار الثالث", opt4: "الاختيار الرابع", correct: "1" }
        ];
    } else if(type === 'para') { newSec.title = "عنوان فرعي:"; newSec.desc = "تفاصيل الفقرة..."; }
    else if(type === 'cards') { newSec.cols = "2"; newSec.items = [{ title: "كارت 1", desc: "وصف..." }]; }
    else if(type === 'table') { newSec.headers = ["المحور", "التفاصيل"]; newSec.rows = [["عنصر", "بيانات..."]]; }
    else if(type === 'steps') { newSec.items = ["خطوة 1..."]; }
    else if(type === 'forms') { newSec.cols = "1"; newSec.formsList = [{ title: "عنوان الفورم", para: "تفاصيل...", theme: "blue" }]; }

    curPage.sections.push(newSec);
    renderSectionsControls(); renderPreview();
}

function moveSection(index, dir) {
    const secs = projectData.pages[projectData.currentPageIndex].sections;
    if(index + dir < 0 || index + dir >= secs.length) return;
    const temp = secs[index]; secs[index] = secs[index + dir]; secs[index + dir] = temp;
    renderSectionsControls(); renderPreview();
}

function removeSection(index) {
    projectData.pages[projectData.currentPageIndex].sections.splice(index, 1);
    renderSectionsControls(); renderPreview();
}

function renderSectionsControls() {
    const container = document.getElementById("sectionsControlsList");
    container.innerHTML = "";
    const secs = projectData.pages[projectData.currentPageIndex].sections;

    secs.forEach((sec, sIdx) => {
        let nameMap = { qaBank: "❓ بنك الأسئلة المباشرة", para: "📝 فقرة", cards: "🃏 كروت", table: "📊 جدول", steps: "🔢 خطوات", forms: "📋 سوبر فورم" };
        let boxHtml = `
            <div class="section-builder-box">
                <div class="sec-actions">
                    <button class="icon-btn" onclick="moveSection(${sIdx}, -1)">⬆️</button>
                    <button class="icon-btn" onclick="moveSection(${sIdx}, 1)">⬇️</button>
                    <button class="icon-btn del-sec-btn" onclick="removeSection(${sIdx})">حذف ❌</button>
                </div>
                <h4>${nameMap[sec.type]} (قسم #${sIdx + 1})</h4>
        `;

        if(sec.type === 'qaBank') {
            sec.questions.forEach((qObj, qIdx) => {
                boxHtml += `
                    <div class="card-control-box">
                        <label>سؤال #${qIdx + 1}:</label>
                        <textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].q=this.value; renderPreview();">${qObj.q}</textarea>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <input type="text" value="${qObj.opt1}" placeholder="الخيار 1" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].opt1=this.value; renderPreview();">
                            <input type="text" value="${qObj.opt2}" placeholder="الخيار 2" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].opt2=this.value; renderPreview();">
                        </div>
                        <div style="display:flex; gap:5px; margin-top:5px;">
                            <input type="text" value="${qObj.opt3}" placeholder="الخيار 3" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].opt3=this.value; renderPreview();">
                            <input type="text" value="${qObj.opt4}" placeholder="الخيار 4" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].opt4=this.value; renderPreview();">
                        </div>
                        <label style="margin-top:8px; color:#166534; font-weight:800;">حدد رقم الإجابة الصحيحة (1 أو 2 أو 3 أو 4):</label>
                        <select onchange="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions[${qIdx}].correct=this.value; renderPreview();">
                            <option value="1" ${qObj.correct=='1'?'selected':''}>الخيار الأول (1)</option>
                            <option value="2" ${qObj.correct=='2'?'selected':''}>الخيار الثاني (2)</option>
                            <option value="3" ${qObj.correct=='3'?'selected':''}>الخيار الثالث (3)</option>
                            <option value="4" ${qObj.correct=='4'?'selected':''}>الخيار الرابع (4)</option>
                        </select>
                        <button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions.splice(${qIdx},1); renderSectionsControls(); renderPreview();" class="icon-btn del-sec-btn" style="margin-top:8px;">حذف هذا السؤال ❌</button>
                    </div>
                `;
            });
            boxHtml += `<button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].questions.push({q:'سؤال جديد...', opt1:'أ', opt2:'ب', opt3:'ج', opt4:'د', correct:'1'}); renderSectionsControls(); renderPreview();" class="sub-btn" style="background:#155724; color:#fff; padding:8px 12px; border-radius:8px; border:none; margin-top:10px; cursor:pointer;">➕ إضافة سؤال جديد للبنك</button>`;
        } else if(sec.type === 'para') {
            boxHtml += `<label>العنوان:</label><input type="text" value="${sec.title}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].title=this.value; renderPreview();">
                        <label>النص:</label><textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].desc=this.value; renderPreview();">${sec.desc}</textarea>`;
        }

        boxHtml += `</div>`;
        container.innerHTML += boxHtml;
    });
}

function updateGlobalSettings() {
    projectData.global.title = document.getElementById("titleInput").value;
    projectData.global.badge = document.getElementById("badgeInput").value;
    projectData.global.footer = document.getElementById("footerInput").value;
    projectData.global.theme = document.getElementById("themeInput").value;
    projectData.global.showPage = document.getElementById("chkShowPage").checked;
    renderPreview();
}

function renderPreview() {
    document.getElementById("title").textContent = projectData.global.title;
    document.getElementById("badge").textContent = projectData.global.badge;
    document.getElementById("footerDesigner").textContent = projectData.global.footer;
    
    const totalPages = projectData.pages.length;
    const pageNumElem = document.getElementById("footerPageNum");
    if(projectData.global.showPage) {
        pageNumElem.style.display = "inline-block";
        pageNumElem.textContent = `صفحة ${projectData.currentPageIndex + 1} من ${totalPages}`;
    } else {
        pageNumElem.style.display = "none";
    }

    const captureDiv = document.getElementById("capture");
    captureDiv.className = "preview";
    if(projectData.global.theme !== "blue") captureDiv.classList.add("theme-" + projectData.global.theme);

    const container = document.getElementById("dynamicContentCard");
    container.innerHTML = "";
    const secs = projectData.pages[projectData.currentPageIndex].sections;

    secs.forEach(sec => {
        if(sec.type === 'qaBank') {
            let qaHtml = `<div class="qa-container">`;
            sec.questions.forEach((qObj, idx) => {
                let opt1Class = qObj.correct === '1' ? 'correct' : '';
                let opt2Class = qObj.correct === '2' ? 'correct' : '';
                let opt3Class = qObj.correct === '3' ? 'correct' : '';
                let opt4Class = qObj.correct === '4' ? 'correct' : '';

                qaHtml += `
                    <div class="qa-item-box">
                        <div class="qa-question"><div class="qa-qnum">${idx + 1}</div><div>${qObj.q}</div></div>
                        <div class="qa-options-grid">
                            <div class="qa-opt ${opt1Class}">أ) ${qObj.opt1} ${qObj.correct === '1' ? '✓ (الإجابة الصحيحة)' : ''}</div>
                            <div class="qa-opt ${opt2Class}">ب) ${qObj.opt2} ${qObj.correct === '2' ? '✓ (الإجابة الصحيحة)' : ''}</div>
                            <div class="qa-opt ${opt3Class}">ج) ${qObj.opt3} ${qObj.correct === '3' ? '✓ (الإجابة الصحيحة)' : ''}</div>
                            <div class="qa-opt ${opt4Class}">د) ${qObj.opt4} ${qObj.correct === '4' ? '✓ (الإجابة الصحيحة)' : ''}</div>
                        </div>
                    </div>
                `;
            });
            qaHtml += `</div>`;
            container.innerHTML += qaHtml;
        } else if(sec.type === 'para') {
            container.innerHTML += `<div class="custom-paragraph-box"><div class="para-title">${sec.title}</div><div class="para-text">${sec.desc}</div></div>`;
        }
    });
}

function saveProjectToLocal() {
    localStorage.setItem("myEducationProject", JSON.stringify(projectData));
    alert("تم حفظ المشروع محلياً بنجاح! 💾");
}

function loadProjectFromLocal() {
    const data = localStorage.getItem("myEducationProject");
    if(data) {
        projectData = JSON.parse(data);
        document.getElementById("titleInput").value = projectData.global.title;
        document.getElementById("badgeInput").value = projectData.global.badge;
        document.getElementById("footerInput").value = projectData.global.footer;
        document.getElementById("themeInput").value = projectData.global.theme;
        document.getElementById("chkShowPage").checked = projectData.global.showPage;
        if(projectData.global.logoSrc) document.getElementById("logoImg").src = projectData.global.logoSrc;
        renderTabs(); renderSectionsControls(); renderPreview();
        alert("تم تحميل المشروع المحفوظ بنجاح! 📂");
    } else { alert("لا يوجد مشروع محفوظ."); }
}

document.getElementById("logoUploadInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            projectData.global.logoSrc = evt.target.result;
            document.getElementById("logoImg").src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }
});

function downloadCurrentImage() {
    const panel = document.querySelector(".panel");
    const tabs = document.querySelector(".page-tabs");
    panel.style.display = "none"; tabs.style.display = "none";

    html2canvas(document.getElementById("capture"), { scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = `QA_Sheet_Page_${projectData.currentPageIndex + 1}.png`;
        link.href = canvas.toDataURL("image/png", 1);
        link.click();
        panel.style.display = "block"; tabs.style.display = "flex";
    });
}

async function downloadAllPagesPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const origIndex = projectData.currentPageIndex;

    const panel = document.querySelector(".panel");
    const tabs = document.querySelector(".page-tabs");
    panel.style.display = "none"; tabs.style.display = "none";

    for(let i = 0; i < projectData.pages.length; i++) {
        switchPage(i);
        await new Promise(r => setTimeout(r, 300));
        const canvas = await html2canvas(document.getElementById("capture"), { scale: 2, useCORS: true });
        const imgData = canvas.toDataURL("image/png");

        if(i > 0) pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, 0, 210, (canvas.height * 210) / canvas.width);
    }

    pdf.save("Complete_Question_Bank.pdf");
    switchPage(origIndex);
    panel.style.display = "block"; tabs.style.display = "flex";
}

window.onload = function() {
    renderTabs();
    renderSectionsControls();
    renderPreview();
};
</script>
</body>
