<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منظومة الشروحات والمذكرات التعليمية الشاملة - م. علي عادل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
body{ background:#eef3f9; padding:20px; }
.container{ max-width:1100px; margin:auto; }

.page-tabs {
    display: flex; gap: 10px; margin-bottom: 15px; align-items: center; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap;
}
.tab-btn {
    background: #e2e8f0; color: #0d2344; padding: 10px 18px; border-radius: 10px; font-weight: 700; border: none; cursor: pointer; white-space: nowrap;
}
.tab-btn.active { background: #1b5e20; color: #fff; }
.add-tab-btn { background: #f3b31a; color: #0d2344; font-weight: 800; }
.del-tab-btn { background: #721c24; color: #fff; padding: 10px 14px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; }

.preview{
background: #ffffff;
position:relative;
padding:30px;
overflow:hidden;
width: 1000px;
min-height: 1400px;
display: flex;
flex-direction: column;
justify-content: space-between;
box-shadow: 0 10px 30px rgba(0,0,0,0.08);
border-radius: 12px;
margin: 0 auto;
border-top: 8px solid #1b5e20;
}

.top-header { display: flex; align-items: center; justify-content: space-between; position: relative; margin-bottom: 15px; flex-shrink: 0; }
.logo-circle { width: 130px; height: 130px; background: #f1f8e9; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); z-index: 5; overflow: hidden; padding: 0; border: 3px solid #1b5e20; }
.logo-circle img { width: 100%; height: 100%; object-fit: cover; }
.main-title-box { background: #1b5e20; color: white; flex: 1; margin-right: -30px; margin-left: 20px; height: 65px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 26px; font-weight: 800; padding-right: 40px; border: 2px solid #2e7d32; }

.badge-row { display: flex; align-items: center; justify-content: center; margin-bottom: 20px; width: 100%; flex-shrink: 0; }
.line-separator { flex: 1; height: 2px; background: #1b5e20; position: relative; margin: 0 20px; }
.line-separator::after { content: ''; position: absolute; width: 8px; height: 8px; background: #1b5e20; border-radius: 50%; top: -3px; }
.line-separator.right::after { left: 0; } .line-separator.left::after { right: 0; }
.badge-main { background: #f1f8e9; color: #1b5e20; font-size: 22px; font-weight: 800; padding: 4px 35px; border-radius: 12px; white-space: nowrap; border: 2px solid #2e7d32; }

.content-card { border: 3px solid #1b5e20; border-radius: 20px; background: #ffffff; padding: 25px; flex: 1; display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }

.cards-grid { display: grid; gap: 15px; width: 100%; }
.info-card-item { border: 2px solid #1b5e20; border-radius: 15px; padding: 15px; background: #f8fafc; }
.info-card-title { font-size: 21px; font-weight: 800; color: #1b5e20; margin-bottom: 5px; }
.info-card-desc { font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }

.comparison-table { width: 100%; border-collapse: collapse; }
.comparison-table th, .comparison-table td { border: 2px solid #1b5e20; padding: 10px; text-align: center; font-size: 18px; font-weight: 700; }
.comparison-table th { background: #1b5e20; color: white; }
.comparison-table td { color: #1b5e20; background: #fff; }

.steps-container { display: flex; flex-direction: column; gap: 12px; }
.step-row { display: flex; align-items: center; gap: 15px; background: #f8fafc; border: 2px solid #1b5e20; border-radius: 12px; padding: 12px 18px; }
.step-num { width: 40px; height: 40px; background: #1b5e20; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex-shrink: 0; }
.step-text { font-size: 20px; font-weight: 700; color: #1b5e20; }

.text-img-layout { display: flex; gap: 20px; align-items: center; width: 100%; }
.text-side { flex: 1; font-size: 21px; font-weight: 700; color: #1b5e20; line-height: 1.6; }
.img-side { width: 350px; height: 250px; border: 2px dashed #1b5e20; border-radius: 15px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #f1f5f9; flex-shrink: 0; }
.img-side img { width: 100%; height: 100%; object-fit: cover; }

.custom-paragraph-box { background: #f1f8e9; border-right: 6px solid #1b5e20; padding: 15px 20px; border-radius: 10px; width: 100%; border: 2px solid #2e7d32; }
.para-title { font-size: 22px; font-weight: 800; color: #1b5e20; margin-bottom: 5px; }
.para-text { font-size: 19px; font-weight: 600; color: #333; line-height: 1.6; }

.alert-box { background: #fffde7; border: 2px dashed #fbc02d; border-radius: 15px; padding: 15px 20px; width: 100%; display: flex; align-items: center; gap: 15px; }
.alert-icon { font-size: 32px; }
.alert-content { flex: 1; }
.alert-title { font-size: 20px; font-weight: 800; color: #f57f17; margin-bottom: 3px; }
.alert-text { font-size: 18px; font-weight: 600; color: #444; }

.forms-grid { display: grid; gap: 15px; width: 100%; }
.super-form-card { border: 2px solid #1b5e20; border-radius: 15px; background: #ffffff; overflow: hidden; }
.super-form-header { background: #1b5e20; color: #fff; padding: 10px 15px; font-size: 20px; font-weight: 800; }
.super-form-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.sf-sub-title { font-size: 18px; font-weight: 800; color: #1b5e20; }
.sf-para { font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }
.sf-list { padding-right: 20px; font-size: 17px; font-weight: 600; color: #333; line-height: 1.5; }
.sf-note { background: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 16px; font-weight: 700; color: #1b5e20; border-right: 4px solid #f3b31a; }

/* الثيمات المخصصة */
.f-theme-blue .super-form-header { background: #0d2344 !important; }
.f-theme-green .super-form-header { background: #1b5e20 !important; }
.f-theme-red .super-form-header { background: #721c24 !important; }
.f-theme-purple .super-form-header { background: #5a2d82 !important; }

.highlight-text { color: #d97706; background: rgba(243, 179, 26, 0.2); padding: 2px 6px; border-radius: 4px; font-weight: 700; }

.footer-bar { background: #1b5e20; height: 60px; margin: 0 -30px -30px -30px; position: relative; display: flex; justify-content: center; align-items: center; border-top: 5px solid #f3b31a; flex-shrink: 0; }
.footer-text { color: white; font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 40px; }
.footer-text::before, .footer-text::after { content: ''; display: inline-block; width: 40px; height: 3px; background: #f3b31a; }

.panel{ margin-top:30px; background:#fff; border-radius:20px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,.08); }
.panel h2{ margin-bottom:15px; color:#1b5e20; }
label{ display:block; margin-top:12px; margin-bottom:4px; font-weight:700; }
input, textarea, select{ width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; font-size:17px; background: #fff; }
textarea{ height:65px; resize:none; }
.btns{ display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
button{ flex:1; padding:14px; border:none; border-radius:12px; background:#1b5e20; color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
button:hover{ opacity:.9; }
.section-builder-box { background: #f8fafc; border: 2px solid #e2e8f0; padding: 15px; border-radius: 12px; margin-top: 15px; position: relative; }
.sec-actions { display: flex; gap: 8px; position: absolute; left: 15px; top: 15px; }
.icon-btn { background: #cbd5e1; color: #0d2344; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 14px; }
.del-sec-btn { background: #721c24; color: #fff; }
.card-control-box { background: #fff; border: 1px solid #cbd5e1; padding: 12px; border-radius: 10px; margin-top: 10px; }
.add-sec-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; background: #e2e8f0; padding: 15px; border-radius: 12px; }
.add-sec-bar button { background: #1b5e20; font-size: 15px; padding: 10px; }
</style>
</head>
<body>

<div class="container">
  
  <div class="page-tabs">
    <div id="tabsContainer" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
    <button class="tab-btn add-tab-btn" onclick="addNewPage()">➕ إضافة صفحة جديدة</button>
    <button class="tab-btn del-tab-btn" onclick="deleteCurrentPage()">🗑️ حذف هذه الصفحة</button>
  </div>

  <div class="preview" id="capture">
    
    <div class="top-header">
        <div class="main-title-box" id="title">أسئلة الجهاز المركزي للتنظيم والإدارة</div>
        <div class="logo-circle">
            <img id="logoImg" src="https://upload.wikimedia.org/wikipedia/commons/e/fe/Coat_of_arms_of_Egypt_%20%28Official%29.svg">
        </div>
    </div>
    
    <div class="badge-row">
        <div class="line-separator right"></div>
        <div class="badge-main" id="badge">موسوعة الكفايات والشرح الميسر</div>
        <div class="line-separator left"></div>
    </div>
    
    <div class="content-card" id="dynamicContentCard"></div>
    
    <div class="footer-bar">
        <div class="footer-text">
            <span id="footerDesigner">إعداد: م. علي عادل</span>
            <span id="footerPageNum" style="display:none; background:#f3b31a; color:#0d2344; padding:2px 12px; border-radius:6px; font-size:18px;"></span>
        </div>
    </div>
    
  </div>

  <div class="panel">
    <h2>لوحة تحكم تصميم الملزمة الاحترافية</h2>
    
    <div style="display:flex; gap:10px; margin-bottom:15px;">
        <button onclick="saveProjectToLocal()" style="background:#1b5e20;">💾 حفظ المشروع محلياً</button>
        <button onclick="loadProjectFromLocal()" style="background:#016280;">📂 فتح المشروع المحفوظ</button>
    </div>

    <label>العنوان العلوي الرئيسي</label>
    <input id="titleInput" value="أسئلة الجهاز المركزي للتنظيم والإدارة" oninput="updateGlobalSettings()">
    
    <label>نص الشارة الوسطى</label>
    <input id="badgeInput" value="موسوعة الكفايات والشرح الميسر" oninput="updateGlobalSettings()">

    <label>اختر اللوجو من جهازك:</label>
    <input type="file" id="logoUploadInput" accept="image/*">
    
    <label>اسم المصمم (الفوتر)</label>
    <input id="footerInput" value="إعداد: م. علي عادل" oninput="updateGlobalSettings()">

    <div class="section-box" style="margin-top:15px;">
        <label><input type="checkbox" id="chkShowPage" onchange="updateGlobalSettings()" style="width:20px; height:20px; display:inline-block;"> تفعيل ترقيم الصفحات في الفوتر</label>
    </div>

    <h3 style="margin-top:25px; color:#1b5e20;">➕ أضف أقساماً للصفحة الحالية:</h3>
    <div class="add-sec-bar">
        <button onclick="addSection('para')">➕ فقرة / عنوان</button>
        <button onclick="addSection('alert')">💡 مفتاح الحل / تنبيه</button>
        <button onclick="addSection('cards')">🃏 قسم كروت</button>
        <button onclick="addSection('table')">📊 جدول مقارنة</button>
        <button onclick="addSection('steps')">🔢 خطوات مرتبة</button>
        <button onclick="addSection('textImg')">🖼️ نص مع صورة</button>
        <button onclick="addSection('forms')">📋 سوبر فورم متقدم</button>
    </div>

    <div id="sectionsControlsList" style="margin-top:20px;"></div>

    <div class="btns">
        <button onclick="downloadCurrentImage()" style="background: #f3b31a; color: #0d2344;">تحميل الصفحة كـ صورة HD 🖼️</button>
        <button onclick="downloadAllPagesPDF()" style="background: #c65102; color: #fff;">تصدير كل الصفحات PDF رسمي 📄</button>
    </div>
  </div>

</div>

<script>
let projectData = {
    global: {
        title: "أسئلة الجهاز المركزي للتنظيم والإدارة",
        badge: "موسوعة الكفايات والشرح الميسر",
        footer: "إعداد: م. علي عادل",
        showPage: true,
        logoSrc: "https://upload.wikimedia.org/wikipedia/commons/e/fe/Coat_of_arms_of_Egypt_%20%28Official%29.svg"
    },
    currentPageIndex: 0,
    pages: [
        {
            sections: [
                { id: 1, type: "para", title: "الهمزة المتوسطة (سلم الحركات):", desc: "هي الهمزة التي ترد في وسط الكلمة، وتكتب بمقارنة حركتها بحركة الحرف الذي قبلها، ثم تُرسم على الحرف الذي يناسب الحركة الأقوى." },
                { id: 2, type: "alert", icon: "💡", title: "مفتاح الحل السريع في الامتحان:", desc: "عند سؤال الاختيار من متعدد، انظر إلى الموقع الإعرابي للكلمة؛ ففي حالة الرفع ترسم على الواو (أبناؤنا)، وفي النصب على السطر (إن أبناءنا)، وفي الجر على النبرة (أبنائنا)." }
            ]
        }
    ]
};

function renderTabs() {
    const container = document.getElementById("tabsContainer");
    container.innerHTML = "";
    projectData.pages.forEach((p, idx) => {
        const activeClass = idx === projectData.currentPageIndex ? "active" : "";
        container.innerHTML += `<button class="tab-btn ${activeClass}" onclick="switchPage(${idx})">صفحة ${idx + 1}</button>`;
    });
}

function addNewPage() {
    projectData.pages.push({ sections: [] });
    projectData.currentPageIndex = projectData.pages.length - 1;
    renderTabs();
    renderSectionsControls();
    renderPreview();
}

function deleteCurrentPage() {
    if(projectData.pages.length === 1) {
        alert("لا يمكنك حذف الصفحة الأخيرة الوحيدة!");
        return;
    }
    projectData.pages.splice(projectData.currentPageIndex, 1);
    if(projectData.currentPageIndex >= projectData.pages.length) {
        projectData.currentPageIndex = projectData.pages.length - 1;
    }
    renderTabs();
    renderSectionsControls();
    renderPreview();
}

function switchPage(index) {
    projectData.currentPageIndex = index;
    renderTabs();
    renderSectionsControls();
    renderPreview();
}

function addSection(type) {
    const curPage = projectData.pages[projectData.currentPageIndex];
    let newSec = { id: Date.now(), type: type };

    if(type === 'para') { newSec.title = "عنوان فرعي:"; newSec.desc = "تفاصيل الفقرة هنا..."; }
    else if(type === 'alert') { newSec.icon = "💡"; newSec.title = "مفتاح الحل السريع:"; newSec.desc = "نص الملاحظة أو التنبيه..."; }
    else if(type === 'cards') { newSec.cols = "2"; newSec.items = [{ title: "النقطة الأولى", desc: "وصف..." }, { title: "النقطة الثانية", desc: "وصف..." }]; }
    else if(type === 'table') { 
        newSec.headers = ["القاعدة", "موضع الرسم", "أمثلة اختبارية"]; 
        newSec.rows = [["الحالة الأولى", "الشرح هنا...", "أمثلة..."]]; 
    }
    else if(type === 'steps') { newSec.items = ["الخطوة الأولى...", "الخطوة الثانية..."]; }
    else if(type === 'textImg') { newSec.desc = "نص الشرح التوضيحي..."; newSec.imgSrc = "https://via.placeholder.com/350x250?text=اختر+صورة"; }
    else if(type === 'forms') { 
        newSec.cols = "1"; 
        newSec.formsList = [
            { title: "عنوان الفورم الرئيسي", subtitle: "عنصر فرعي:", para: "تفاصيل...", list: "• نقطة أولى\n• نقطة ثانية", note: "ملحوظة مهمة", theme: "green" }
        ]; 
    }

    curPage.sections.push(newSec);
    renderSectionsControls();
    renderPreview();
}

function moveSection(index, dir) {
    const secs = projectData.pages[projectData.currentPageIndex].sections;
    if(index + dir < 0 || index + dir >= secs.length) return;
    const temp = secs[index];
    secs[index] = secs[index + dir];
    secs[index + dir] = temp;
    renderSectionsControls();
    renderPreview();
}

function removeSection(index) {
    projectData.pages[projectData.currentPageIndex].sections.splice(index, 1);
    renderSectionsControls();
    renderPreview();
}

 function renderSectionsControls() {
    const container = document.getElementById("sectionsControlsList");
    container.innerHTML = "";
    const secs = projectData.pages[projectData.currentPageIndex].sections;

    secs.forEach((sec, sIdx) => {
        let nameMap = { para: "📝 فقرة", alert: "💡 تنبيه", cards: "🃏 كروت", table: "📊 جدول", steps: "🔢 خطوات", textImg: "🖼️ صورة", forms: "📋 سوبر فورم" };
        let boxHtml = `
            <div class="section-builder-box">
                <div class="sec-actions">
                    <button class="icon-btn" onclick="moveSection(${sIdx}, -1)">⬆️ أعلى</button>
                    <button class="icon-btn" onclick="moveSection(${sIdx}, 1)">⬇️ أسفل</button>
                    <button class="icon-btn del-sec-btn" onclick="removeSection(${sIdx})">حذف ❌</button>
                </div>
                <h4>${nameMap[sec.type]} (قسم #${sIdx + 1})</h4>
        `;

        if(sec.type === 'para') {
            boxHtml += `
                <label>العنوان:</label><input type="text" value="${sec.title}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].title=this.value; renderPreview();">
                <label>النص:</label><textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].desc=this.value; renderPreview();">${sec.desc}</textarea>
            `;
        } else if(sec.type === 'alert') {
            boxHtml += `
                <label>الأيقونة:</label><input type="text" value="${sec.icon}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].icon=this.value; renderPreview();">
                <label>العنوان:</label><input type="text" value="${sec.title}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].title=this.value; renderPreview();">
                <label>النص:</label><textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].desc=this.value; renderPreview();">${sec.desc}</textarea>
            `;
        } else if(sec.type === 'cards') {
            boxHtml += `
                <label>عدد الكروت في الصف:</label>
                <select onchange="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].cols=this.value; renderPreview();">
                    <option value="1" ${sec.cols=='1'?'selected':''}>1</option>
                    <option value="2" ${sec.cols=='2'?'selected':''}>2</option>
                    <option value="3" ${sec.cols=='3'?'selected':''}>3</option>
                </select>
            `;
            sec.items.forEach((item, iIdx) => {
                boxHtml += `
                    <div class="card-control-box">
                        <label>كارت #${iIdx + 1}</label>
                        <input type="text" value="${item.title}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items[${iIdx}].title=this.value; renderPreview();" placeholder="العنوان">
                        <textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items[${iIdx}].desc=this.value; renderPreview();" placeholder="الوصف">${item.desc}</textarea>
                        <button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items.splice(${iIdx},1); renderSectionsControls(); renderPreview();" class="icon-btn del-sec-btn">حذف كارت ❌</button>
                    </div>
                `;
            });
            boxHtml += `<button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items.push({title:'عنوان جديد',desc:'وصف...'}); renderSectionsControls(); renderPreview();" style="background:#1b5e20; color:#fff; padding:8px 12px; border-radius:8px; border:none; margin-top:8px; cursor:pointer;">➕ إضافة كارت</button>`;
        } else if(sec.type === 'table') {
            boxHtml += `<label>عناوين الأعمدة (مفصولين بفاصلة ,):</label>`;
            boxHtml += `<input type="text" value="${sec.headers.join(', ')}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].headers=this.value.split(',').map(h=>h.trim()); renderSectionsControls(); renderPreview();">`;
            sec.rows.forEach((row, rIdx) => {
                boxHtml += `<div class="card-control-box"><div style="display:flex; gap:5px; flex-wrap:wrap;">`;
                sec.headers.forEach((h, cIdx) => {
                    let val = row[cIdx] || "";
                    boxHtml += `<input type="text" value="${val}" placeholder="${h}" oninput="if(!projectData.pages[projectData.currentPageIndex].sections[${sIdx}].rows[${rIdx}])projectData.pages[projectData.currentPageIndex].sections[${sIdx}].rows[${rIdx}]=[]; projectData.pages[projectData.currentPageIndex].sections[${sIdx}].rows[${rIdx}][${cIdx}]=this.value; renderPreview();" style="flex:1;">`;
                });
                boxHtml += `</div><button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].rows.splice(${rIdx},1); renderSectionsControls(); renderPreview();" class="icon-btn del-sec-btn" style="margin-top:5px;">حذف الصف ❌</button></div>`;
            });
            boxHtml += `<button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].rows.push(projectData.pages[projectData.currentPageIndex].sections[${sIdx}].headers.map(()=>'بيانات...')); renderSectionsControls(); renderPreview();" style="background:#1b5e20; color:#fff; padding:8px 12px; border-radius:8px; border:none; margin-top:8px; cursor:pointer;">➕ إضافة صف</button>`;
        } else if(sec.type === 'steps') {
            sec.items.forEach((st, stIdx) => {
                boxHtml += `
                    <div class="card-control-box">
                        <label>خطوة #${stIdx + 1}</label>
                        <textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items[${stIdx}]=this.value; renderPreview();">${st}</textarea>
                        <button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items.splice(${stIdx},1); renderSectionsControls(); renderPreview();" class="icon-btn del-sec-btn">حذف الخطوة ❌</button>
                    </div>
                `;
            });
            boxHtml += `<button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].items.push('تفاصيل الخطوة...'); renderSectionsControls(); renderPreview();" style="background:#1b5e20; color:#fff; padding:8px 12px; border-radius:8px; border:none; margin-top:8px; cursor:pointer;">➕ إضافة خطوة</button>`;
        } else if(sec.type === 'forms') {
            sec.formsList.forEach((f, fIdx) => {
                boxHtml += `
                    <div class="card-control-box">
                        <label>فورم #${fIdx + 1} - لون الهيدر:</label>
                        <select onchange="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].theme=this.value; renderPreview();">
                            <option value="green" ${f.theme=='green'?'selected':''}>أخضر رسمي</option>
                            <option value="blue" ${f.theme=='blue'?'selected':''}>أزرق ملكي</option>
                            <option value="red" ${f.theme=='red'?'selected':''}>أحمر عنابي</option>
                            <option value="purple" ${f.theme=='purple'?'selected':''}>بنفسجي إبداعي</option>
                        </select>
                        <label>عنوان الهيدر:</label>
                        <input type="text" value="${f.title}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].title=this.value; renderPreview();">
                        <label>عنوان فرعي:</label>
                        <input type="text" value="${f.subtitle}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].subtitle=this.value; renderPreview();">
                        <label>فقرة:</label>
                        <textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].para=this.value; renderPreview();">${f.para}</textarea>
                        <label>النقاط (كل سطر نقطة):</label>
                        <textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].list=this.value; renderPreview();">${f.list}</textarea>
                        <label>ملحوظة:</label>
                        <input type="text" value="${f.note}" oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList[${fIdx}].note=this.value; renderPreview();">
                        <button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList.splice(${fIdx},1); renderSectionsControls(); renderPreview();" class="icon-btn del-sec-btn">حذف الفورم ❌</button>
                    </div>
                `;
            });
            boxHtml += `<button type="button" onclick="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].formsList.push({title:'فورم جديد', subtitle:'عنصر فرعي:', para:'تفاصيل...', list:'• نقطة', note:'ملحوظة', theme:'green'}); renderSectionsControls(); renderPreview();" style="background:#1b5e20; color:#fff; padding:8px 12px; border-radius:8px; border:none; margin-top:8px; cursor:pointer;">➕ إضافة فورم</button>`;
        } else if(sec.type === 'textImg') {
            boxHtml += `
                <label>نص الشرح:</label><textarea oninput="projectData.pages[projectData.currentPageIndex].sections[${sIdx}].desc=this.value; renderPreview();">${sec.desc}</textarea>
                <label>اختر صورة:</label><input type="file" accept="image/*" onchange="uploadSecImg(event, ${sIdx})">
            `;
        }

        boxHtml += `</div>`;
        container.innerHTML += boxHtml;
    });
}

function uploadSecImg(e, sIdx) {
    const file = e.target.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            projectData.pages[projectData.currentPageIndex].sections[sIdx].imgSrc = evt.target.result;
            renderPreview();
        };
        reader.readAsDataURL(file);
    }
}

function updateGlobalSettings() {
    projectData.global.title = document.getElementById("titleInput").value;
    projectData.global.badge = document.getElementById("badgeInput").value;
    projectData.global.footer = document.getElementById("footerInput").value;
    projectData.global.showPage = document.getElementById("chkShowPage").checked;
    renderPreview();
}

function renderPreview() {
    document.getElementById("title").textContent = projectData.global.title;
    document.getElementById("badge").textContent = projectData.global.badge;
    document.getElementById("footerDesigner").textContent = projectData.global.footer;
    
    const totalPages = projectData.pages.length;
    const pageNumElem = document.getElementById("footerPageNum");
    if(projectData.global.showPage) {
        pageNumElem.style.display = "inline-block";
        pageNumElem.textContent = `Page ${projectData.currentPageIndex + 1} of ${totalPages}`;
    } else {
        pageNumElem.style.display = "none";
    }

    const container = document.getElementById("dynamicContentCard");
    container.innerHTML = "";
    const secs = projectData.pages[projectData.currentPageIndex].sections;

    secs.forEach(sec => {
        if(sec.type === 'para') {
            container.innerHTML += `<div class="custom-paragraph-box"><div class="para-title">${sec.title}</div><div class="para-text">${sec.desc}</div></div>`;
        } else if(sec.type === 'alert') {
            container.innerHTML += `<div class="alert-box"><div class="alert-icon">${sec.icon}</div><div class="alert-content"><div class="alert-title">${sec.title}</div><div class="alert-text">${sec.desc}</div></div></div>`;
        } else if(sec.type === 'cards') {
            let itemsHtml = "";
            sec.items.forEach(it => { itemsHtml += `<div class="info-card-item"><div class="info-card-title">${it.title}</div><div class="info-card-desc">${it.desc}</div></div>`; });
            container.innerHTML += `<div class="cards-grid" style="grid-template-columns: repeat(${sec.cols}, 1fr);">${itemsHtml}</div>`;
        } else if(sec.type === 'table') {
            let thHtml = ""; sec.headers.forEach(h => { thHtml += `<th>${h}</th>`; });
            let tableHtml = `<table class="comparison-table"><thead><tr>${thHtml}</tr></thead><tbody>`;
            sec.rows.forEach(r => {
                tableHtml += `<tr>`;
                sec.headers.forEach((h, idx) => { tableHtml += `<td>${r[idx] || ""}</td>`; });
                tableHtml += `</tr>`;
            });
            tableHtml += `</tbody></table>`;
            container.innerHTML += tableHtml;
        } else if(sec.type === 'steps') {
            let stepsHtml = `<div class="steps-container">`;
            sec.items.forEach((st, idx) => {
                stepsHtml += `<div class="step-row"><div class="step-num">${idx + 1}</div><div class="step-text">${st}</div></div>`;
            });
            stepsHtml += `</div>`;
            container.innerHTML += stepsHtml;
        } else if(sec.type === 'forms') {
            let formsHtml = "";
            sec.formsList.forEach(f => {
                let listHtml = f.list ? f.list.split("\n").map(l => `<div>${l}</div>`).join("") : "";
                formsHtml += `
                    <div class="super-form-card f-theme-${f.theme || 'green'}">
                        <div class="super-form-header">${f.title}</div>
                        <div class="super-form-body">
                            ${f.subtitle ? `<div class="sf-sub-title">${f.subtitle}</div>` : ''}
                            ${f.para ? `<div class="sf-para">${f.para}</div>` : ''}
                            ${listHtml ? `<div class="sf-list">${listHtml}</div>` : ''}
                            ${f.note ? `<div class="sf-note">${f.note}</div>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML += `<div class="forms-grid" style="grid-template-columns: repeat(${sec.cols}, 1fr);">${formsHtml}</div>`;
        } else if(sec.type === 'textImg') {
            container.innerHTML += `<div class="text-img-layout"><div class="text-side">${sec.desc}</div><div class="img-side"><img src="${sec.imgSrc}"></div></div>`;
        }
    });
}

function saveProjectToLocal() {
    localStorage.setItem("myOfficialMalzama", JSON.stringify(projectData));
    alert("تم حفظ المشروع محلياً بنجاح! 💾");
}

function loadProjectFromLocal() {
    const data = localStorage.getItem("myOfficialMalzama");
    if(data) {
        projectData = JSON.parse(data);
        document.getElementById("titleInput").value = projectData.global.title;
        document.getElementById("badgeInput").value = projectData.global.badge;
        document.getElementById("footerInput").value = projectData.global.footer;
        document.getElementById("chkShowPage").checked = projectData.global.showPage;
        if(projectData.global.logoSrc) document.getElementById("logoImg").src = projectData.global.logoSrc;
        renderTabs();
        renderSectionsControls();
        renderPreview();
        alert("تم تحميل المشروع المحفوظ بنجاح! 📂");
    } else {
        alert("لا يوجد مشروع محفوظ حالياً.");
    }
}

document.getElementById("logoUploadInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            projectData.global.logoSrc = evt.target.result;
            document.getElementById("logoImg").src = evt.target.result;
        };
        reader.readAsDataURL(file);
    }
});

function downloadCurrentImage() {
    const panel = document.querySelector(".panel");
    const tabs = document.querySelector(".page-tabs");
    panel.style.display = "none";
    tabs.style.display = "none";

    html2canvas(document.getElementById("capture"), { scale: 3, useCORS: true }).then(canvas => {
        const link = document.createElement("a");
        link.download = `Malzama_Page_${projectData.currentPageIndex + 1}.png`;
        link.href = canvas.toDataURL("image/png", 1);
        link.click();
        panel.style.display = "block";
        tabs.style.display = "flex";
    });
}

async function downloadAllPagesPDF() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const origIndex = projectData.currentPageIndex;

    const panel = document.querySelector(".panel");
    const tabs = document.querySelector(".page-tabs");
    panel.style.display = "none";
    tabs.style.display = "none";

    for(let i = 0; i < projectData.pages.length; i++) {
        switchPage(i);
        await new Promise(r => setTimeout(r, 400));
        const canvas = await html2canvas(document.getElementById("capture"), { scale: 2, useCORS: true });
        const imgData = canvas.toDataURL("image/png");

        if(i > 0) pdf.addPage();
        pdf.addImage(imgData, 'PNG', 0, 0, 210, (canvas.height * 210) / canvas.width);
    }

    pdf.save("Central_Agency_Exam_Guide.pdf");
    switchPage(origIndex);
    panel.style.display = "block";
    tabs.style.display = "flex";
}

window.onload = function() {
    renderTabs();
    renderSectionsControls();
    renderPreview();
};
</script>
